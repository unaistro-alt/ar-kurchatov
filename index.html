<!DOCTYPE html>
<html>

  </head>
  <body style="margin: 0px; overflow: hidden;">
    <a-scene arjs="sourceType: webcam; debugUIEnabled: false">
      <!-- Hiro — это встроенный маркер. Камера ищет его узор. -->

        <a-image src="kurchatov.png" width="1" height="1.5" rotation="90 0 0"></a-image>
      </a-marker>
      <a-entity camera look-controls></a-entity>
    </a-scene>
  </body>
</html>
